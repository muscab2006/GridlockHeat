name: android-build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 (Temurin, pinned by skill)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle setup + caching
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :android:assembleDebug --stacktrace

      - name: Unit tests (game rules)
        run: ./gradlew :core:test

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gridlockheat-debug-apk
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
